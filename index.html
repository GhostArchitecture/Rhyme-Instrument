      sylls = caps.toLowerCase().split("").map(ch => { const [v, c] = LETTERS[ch] || ["AH",""]; return { v, c, s: 1 }; });
      source = "initialism";
    } else if (Object.hasOwn(EXCEPTIONS, w)) {
      sylls = EXCEPTIONS[w].map(t => { const [v, c] = t.split("-"); return { v, c: c || "", s: 1 }; });
      source = "exception";
    } else if (DICT && Object.hasOwn(DICT, w)) { sylls = parseCompact(DICT[w]); source = "cmu"; }
    else { sylls = g2p(raw).map(s => ({ ...s, s: s.reduced ? 0 : 1 })); source = "rule"; }
    if (ov && sylls.length) {
      if (typeof ov === "string") { sylls[sylls.length-1].v = ov; sylls[sylls.length-1].reduced = false; }
      else {
        const n = Math.min(ov.vowels.length, sylls.length);
        for (let i = 0; i < n; i++) { sylls[sylls.length-n+i].v = ov.vowels[i]; sylls[sylls.length-n+i].reduced = false; }
        if (ov.coda != null) sylls[sylls.length-1].c = ov.coda;
      }
      source = "override";
    }
    return { sylls, source };
  }
  function skeleton(text, depth = 1, anchor = "count") {
    const words = text.trim().split(/\s+/).filter(Boolean);
    let sylls = [], source = "none";
    for (let i = words.length - 1; i >= 0 && sylls.length < depth + 4; i--) {
      const p = pronounce(words[i]);
      if (i === words.length - 1) source = p.source;
      sylls = [...p.sylls, ...sylls];
    }
    let tail;
    if (anchor === "stress") {
      let k = sylls.length - 1;
      while (k > 0 && !(sylls[k].s > 0)) k--;
      tail = sylls.slice(Math.min(k, sylls.length - depth));
    } else tail = sylls.slice(-depth);
    const last = tail[tail.length-1];
    return { vowels: tail.map(s => s.v), stress: tail.map(s => s.s),
      coda: last ? last.c : "", reduced: last ? !!last.reduced : false,
      overridden: source === "override", source };
  }
  function classify(a, b, depth = 1, anchor = "count") {
    const sa = skeleton(a, depth, anchor), sb = skeleton(b, depth, anchor);
    if (!sa.vowels.length || !sb.vowels.length) return { kind: "none", sa, sb };
    const n = Math.min(sa.vowels.length, sb.vowels.length);
    const la = sa.vowels.slice(-n), lb = sb.vowels.slice(-n);
    const exact = la.every((v, i) => v === lb[i]) && sa.vowels.length === sb.vowels.length;
    if (!exact) {

      const loose = lastStrict && n > 1 && la.every((v, i) => v === lb[i] || (RED.has(v) && RED.has(lb[i])));
      if (loose) return { kind: "loose", sa, sb };
      if (!lastStrict && (sa.reduced || sb.reduced) && RED.has(la[n-1]) && RED.has(lb[n-1])) return { kind: "loose", sa, sb };
      return { kind: lastStrict ? "shallow" : "none", sa, sb };

    if (clean(a) === clean(b)) return { kind: "identical", sa, sb };

  }
  function buildIndex() {
    INDEX = new Map();
    const push = (key, w) => { const l = INDEX.get(key); if (l) l.push(w); else INDEX.set(key, [w]); };
    for (const w of Object.keys(DICT)) {
      if (w.length < 2 || w.includes("'")) continue;
      const s = parseCompact(DICT[w]);
      for (let d = 1; d <= Math.min(3, s.length); d++) push(d + ":" + s.slice(-d).map(x => x.v).join("|"), w);
      let k = s.length - 1; while (k > 0 && !(s[k].s > 0)) k--;
      push("S:" + s.slice(k).map(x => x.v).join("|"), w);

  }
  function lookup(query, depth = 1, extra = [], anchor = "stress") {
    if (!INDEX) buildIndex();
    const sq = skeleton(query, depth, anchor);
    if (!sq.vowels.length) return { skeleton: sq, perfect: [], slant: [], loose: [] };
    const key = (anchor === "stress" ? "S:" : depth + ":") + sq.vowels.join("|");
    const cand = new Set([...(INDEX.get(key) || []), ...extra.map(clean)]);
    const q = clean(query);
    const perfect = [], slant = [], loose = [];
    for (const w of cand) {
      if (w === q) continue;
      const r = classify(query, w, sq.vowels.length, anchor);
      const item = { word: w, tier: CURATED.has(w) ? 0 : COMMON.has(w) ? 1 : 2, rank: COMMON.get(w) ?? 1e9 };
      if (r.kind === "perfect") perfect.push(item);
      else if (r.kind === "slant") slant.push(item);
      else if (r.kind === "loose") loose.push(item);
    }
    const rank = (a, b) => a.tier - b.tier || a.rank - b.rank || a.word.localeCompare(b.word);
    return { skeleton: sq, perfect: perfect.sort(rank), slant: slant.sort(rank), loose: loose.sort(rank) };
  }
  async function load(onChange) {
    if (status === "ready" || status === "loading") return;
    status = "loading"; error = ""; onChange && onChange(status);
    try {
      const [d, f] = await Promise.all([
        fetch("./cmu_skel.json").then(r => { if (!r.ok) throw new Error("cmu_skel.json " + r.status); return r.json(); }),
        fetch("./google10k.txt").then(r => r.ok ? r.text() : "").catch(() => ""),
      ]);
      DICT = d; INDEX = null;
      COMMON = new Map(f.split("\n").filter(Boolean).map((w, i) => [w.trim(), i]));
      status = "ready";
    } catch (e) { status = "error"; error = String(e.message || e); }
    onChange && onChange(status);
  }
  return { pronounce, skeleton, classify, lookup, load,
    ready: () => status === "ready", status: () => status, error: () => error,
    size: () => DICT ? Object.keys(DICT).length : 0 };
})();
let ENGINE = "v1";
function setEngine(id) { ENGINE = id; }

/* ---------- pivot pages ---------- */
function Lookup({ bank, accent, dense, eng }) {
  const [q, setQ] = useState("");
  const [depth, setDepth] = useState(1);
  const pool = useMemo(() => [...new Set([...LEXICON, ...bank])], [bank]);
  const results = useMemo(() => {
    if (!q.trim()) return null;
    if (useV2()) {
      const r = E2.lookup(q, depth, bank);
      return { perfect: r.perfect, slant: r.slant, loose: r.loose, shallow: [], sk: r.skeleton, v2: true };
    }
    const perfect = [], slant = [], loose = [], shallow = [];
    for (const w of pool) {
      if (w.toLowerCase() === q.trim().toLowerCase()) continue;
      const r = classify(q, w, depth);
      if (r.kind === "perfect") perfect.push(w);
      else if (r.kind === "slant") slant.push(w);
      else if (r.kind === "loose") loose.push(w);
      else if (r.kind === "shallow" && depth > 1) shallow.push(w);
    }
    return { perfect, slant, loose, shallow, sk: skeleton(q, depth) };
  }, [q, depth, pool, eng]);
  const pad = dense ? "8px 10px" : "12px 14px";
  return (
    <div>
      <input value={q} onChange={e => setQ(e.target.value)}
        placeholder="type a word or phrase tail"
        style={{ width: "100%", boxSizing: "border-box", background: MT.panel,
          border: `2px solid ${MT.dim2}`, borderBottom: `2px solid ${accent.hi}`,
          color: MT.fg, padding: pad, fontSize: 17, fontFamily: FONT }} />
      <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
        {[1, 2, 3].map(n => (
          <Press key={n} accent={accent} active={depth === n}
            onClick={() => setDepth(n)} style={{ flex: 1, textAlign: "center" }}>
            {n} syl</Press>
        ))}
      </div>
      {results && (
        <div style={{ marginTop: 16 }}>
          <div style={{ marginBottom: 12, color: MT.dim, fontSize: 12 }}>
            {results.sk.vowels.map((v, i) => <VowelChip key={i} v={v} small />)}
            {results.sk.coda && <Mono style={{ color: MT.dim2 }}> +{results.sk.coda.toLowerCase()}</Mono>}
            {results.v2 && <Mono style={{ color: MT.dim2 }}> · anchored on stress · {E2.size().toLocaleString()} words</Mono>}
          </div>
          {[["perfect", results.perfect, accent.hi],
            ["slant — the melodic lane", results.slant, "#B78CF0"],
            ["reduced — rap-legal", results.loose, "#CDEB8B"],
            ["last vowel only", results.shallow, MT.dim]].map(([label, list, col]) => (
            list && list.length > 0 && (
              <div key={label} style={{ marginBottom: 14 }}>
                <div style={{ color: col, fontSize: 12, fontWeight: 700,
                  textTransform: "lowercase", letterSpacing: 2, marginBottom: 6 }}>
                  {label} · {list.length}</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: dense ? 5 : 8 }}>
                  {list.slice(0, results.v2 ? 90 : 60).map(it => {
                    const w = typeof it === "string" ? it : it.word;
                    const tier = typeof it === "string" ? 0 : it.tier;
                    return (
                    <span key={w} style={{ background: MT.panel,
                      borderLeft: `4px solid ${tier === 2 ? MT.dim2 : col}`,
                      color: tier === 2 ? MT.dim : MT.fg, fontWeight: tier === 0 ? 700 : 400,
                      padding: dense ? "4px 8px" : "6px 10px", fontSize: 14 }}>{w}</span>
                  ); })}
                </div>
              </div>
            )
          ))}
          {results.perfect.length + results.slant.length + (results.loose||[]).length === 0 && (
            <div style={{ color: MT.dim, fontSize: 13 }}>nothing at this depth —
              {results.v2 ? " try a shallower depth; the dictionary anchors on the stressed syllable." :
                " add the word to the bank; the engine will guess its vowels."}</div>
          )}
        </div>
      )}
    </div>
  );
}

function Draft({ draft, setDraft, overrides, setOverride, accent, dense, eng }) {
  const [pop, setPop] = useState("rap");
  const [pick, setPick] = useState(null);
  const limit = pop === "rap" ? 3 : 6;
  const lines = draft.split("\n");
  const analysis = useMemo(() => {
    const rows = lines.map(ln => {
      const clean = ln.trim();
      if (!clean) return null;
      const words = clean.split(/\s+/);
      const last = words[words.length - 1].replace(/[^a-zA-Z']/g, "");
      const sk = skeleton(last, 1);
      const v = sk.vowels[0] || null;
      const watch = pop === "rap" ? CLICHES : [...CLICHES, ...CLICHES_MELODIC];
      const cliche = watch.find(c => clean.toLowerCase().includes(c));
      const filler = FILLERS.has(last.toLowerCase());
      return { text: clean, last, v, cliche, filler, overridden: sk.overridden,
        guess: useV2() && sk.source === "rule" };
    });
    let runs = [], cur = null;
    rows.forEach((r, i) => {
      if (!r || !r.v) { cur = null; return; }
      if (cur && cur.v === r.v) { cur.len++; cur.idx.push(i); }
      else { cur = { v: r.v, len: 1, idx: [i] }; runs.push(cur); }
    });
    const flagged = new Set();
    runs.filter(r => r.len > limit).forEach(r => r.idx.slice(limit).forEach(i => flagged.add(i)));
    const maxRun = runs.reduce((m, r) => Math.max(m, r.len), 0);
    const filled = rows.filter(Boolean);
    let terminal = false;
    if (filled.length >= 6) {
      const lastR = filled[filled.length-1];
      const priors = filled.slice(0, -1).slice(-8);
      terminal = lastR.filler || !priors.some(r => r.v === lastR.v);
    }
    return { rows, flagged, maxRun, terminal };
  }, [draft, pop, overrides, eng]);
  return (
    <div>
      <textarea value={draft} onChange={e => setDraft(e.target.value)}
        placeholder={"paste the draft — one bar per line"}
        rows={dense ? 8 : 10}
        style={{ width: "100%", boxSizing: "border-box", background: MT.panel,
          border: `2px solid ${MT.dim2}`, borderBottom: `2px solid ${accent.hi}`,
          color: MT.fg, padding: 12, fontSize: 15, fontFamily: FONT,
          lineHeight: 1.6, resize: "vertical" }} />
      <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
        {[["rap", "rap · drone past 3"], ["melodic", "melodic · drone past 6"]].map(([id, l]) => (
          <Press key={id} accent={accent} active={pop === id}
            onClick={() => setPop(id)} style={{ flex: 1, textAlign: "center",
            fontSize: 11 }}>{l}</Press>
        ))}
      </div>
      {analysis.rows.some(Boolean) && (
        <div style={{ marginTop: 14 }}>
          {analysis.maxRun > limit && (
            <div style={{ color: MT.amber, marginBottom: 10, fontSize: 12,
              fontFamily: FONT }}>
              drone: {analysis.maxRun} straight bars on one vowel — past the {pop} line of {limit}.</div>
          )}
          {analysis.rows.map((r, i) => r && (
            <div key={i}>
              <div style={{ display: "flex", alignItems: "center", gap: 8,
                padding: dense ? "4px 6px" : "6px 8px",
                borderLeft: analysis.flagged.has(i) ? `4px solid ${MT.amber}` : "4px solid transparent",
                background: analysis.flagged.has(i) ? "#1A1200" : "transparent" }}>
                {r.v ? (
                  <span onClick={() => setPick(pick === i ? null : i)}
                    style={{ cursor: "pointer" }}>
                    <VowelChip v={r.v} small />
                    {r.overridden && <span style={{ color: accent.hi, fontSize: 9,
                      position: "relative", top: -5 }}>●</span>}
                  </span>
                ) : <span style={{ width: 40 }} />}
                <span style={{ color: analysis.flagged.has(i) ? MT.amber : MT.fg,
                  fontSize: 14, flex: 1, fontFamily: FONT }}>{r.text}</span>
                {r.guess && <span style={{ color: MT.dim2, fontSize: 10,
                  fontFamily: FONT }}>guess</span>}
                {r.filler && <span style={{ color: MT.red, fontSize: 10,
                  fontFamily: FONT }}>filler landing</span>}
                {r.cliche && <span style={{ color: MT.red, fontSize: 10,
                  fontFamily: FONT }}>stock: "{r.cliche}"</span>}
              </div>
              {pick === i && (
                <VowelPicker word={r.last.toLowerCase()} overrides={overrides}
                  setOverride={setOverride} onClose={() => setPick(null)} accent={accent} />
              )}
            </div>
          ))}
          {analysis.terminal && (
            <div style={{ color: MT.dim, marginTop: 10, fontSize: 12,
              borderTop: `1px solid ${MT.dim2}`, paddingTop: 8, fontFamily: FONT }}>
              terminal slot reads soft — filler or unpaired vowel on the last bar.
              the logged pattern: weakest material lands last. check it on purpose.</div>
          )}
        </div>
      )}
    </div>
  );
}

          );
        })}
        {bank.length === 0 && <span style={{ color: MT.dim, fontSize: 13,
          fontFamily: FONT }}>empty. words added here join every lookup and persist.</span>}
      </div>
      {pick && (
        <VowelPicker word={pick.split(" ").pop()} overrides={overrides}
          setOverride={setOverride} onClose={() => setPick(null)} accent={accent} />
      )}
    </div>
  );
}

function Tune({ prefs, setPrefs, accent, engStatus }) {
  const Row = ({ label, children }) => (
    <div style={{ marginBottom: 18 }}>
      <div style={{ color: MT.dim, fontSize: 12, letterSpacing: 2,
        textTransform: "lowercase", marginBottom: 6, fontFamily: FONT }}>{label}</div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>{children}</div>
    </div>
  );
  return (
    <div>
      <Row label="accent — which color leads">
        {[["grape", "deep grape"], ["slime", "slime"]].map(([id, l]) => (
          <Press key={id} accent={accent} active={prefs.accent === id}
            onClick={() => setPrefs({ ...prefs, accent: id })}
            style={{ flex: 1, textAlign: "center" }}>{l}</Press>
        ))}
      </Row>
      <Row label="density">
        {[["comfy", "comfortable"], ["dense", "dense"]].map(([id, l]) => (
          <Press key={id} accent={accent} active={prefs.density === id}
            onClick={() => setPrefs({ ...prefs, density: id })}
            style={{ flex: 1, textAlign: "center" }}>{l}</Press>
        ))}
      </Row>
      <Row label="motion">
        {[["on", "tiles move"], ["off", "tiles still"]].map(([id, l]) => (
          <Press key={id} accent={accent} active={prefs.motion === id}
            onClick={() => setPrefs({ ...prefs, motion: id })}
            style={{ flex: 1, textAlign: "center" }}>{l}</Press>
        ))}
      </Row>
      <Row label="start tiles">
        {["lookup", "check", "draft", "bank"].map(id => (
          <Press key={id} accent={accent} active={prefs.tiles.includes(id)}
            onClick={() => setPrefs({ ...prefs,
              tiles: prefs.tiles.includes(id)
                ? prefs.tiles.filter(t => t !== id)
                : [...prefs.tiles, id] })}
            style={{ flex: "1 0 40%", textAlign: "center" }}>{id}</Press>
        ))}
      </Row>
      <Row label="engine">
        {[["v1", "v1.2 · rule G2P"], ["v2", "v2.0 · dictionary"]].map(([id, l]) => (
          <Press key={id} accent={accent} active={(prefs.engine || "v1") === id}
            onClick={() => setPrefs({ ...prefs, engine: id })}
            style={{ flex: 1, textAlign: "center", fontSize: 11 }}>{l}</Press>
        ))}
      </Row>
      <div style={{ color: MT.dim2, fontSize: 11, fontFamily: FONT }}>
        {(prefs.engine || "v1") === "v1"
          ? "engine v1.2 · overrides, initialisms, schwa, filler + terminal watch"
          : engStatus === "ready" ? `engine v2.0 · ${E2.size().toLocaleString()} words · stress-anchored · exception table outranks dictionary`
          : engStatus === "loading" ? "engine v2.0 · loading dictionary (~690 KB) …"
          : engStatus === "error" ? `engine v2.0 · dictionary failed (${E2.error()}) · running v1.2` 
          : "engine v2.0 · idle"}</div>
    </div>
  );
}

/* ---------- start screen: live tiles ---------- */
function Tile({ big, color, txt, title, sub, onClick, motion, flip }) {
  const [face, setFace] = useState(0);
  useEffect(() => {
    if (!motion || !flip) return;
    const id = setInterval(() => setFace(f => 1 - f), 4200 + Math.random() * 2600);
    return () => clearInterval(id);
  }, [motion, flip]);
  return (
    <div onClick={onClick} style={{
      gridColumn: big ? "span 2" : "span 1", aspectRatio: big ? "2.05" : "1",
      background: color, color: txt, cursor: "pointer", position: "relative",
      overflow: "hidden", userSelect: "none",
      perspective: "600px",
    }}>
      <div style={{
        position: "absolute", inset: 0, padding: 10,
        display: "flex", flexDirection: "column", justifyContent: "space-between",
        transform: motion && flip ? `rotateX(${face * 180}deg)` : "none",
        transition: "transform 600ms cubic-bezier(.2,.8,.2,1)",
        transformStyle: "preserve-3d",
      }}>
        <div style={{ transform: face ? "rotateX(180deg)" : "none",
          backfaceVisibility: "visible" }}>
          <div style={{ fontSize: big ? 34 : 26, fontWeight: 200,
            fontFamily: FONT, lineHeight: 1 }}>
            {face && flip ? flip : title}</div>
        </div>
        <div style={{ fontSize: 12, fontFamily: FONT, fontWeight: 600,
          textTransform: "lowercase",
          transform: face ? "rotateX(180deg)" : "none" }}>{sub}</div>
      </div>
    </div>
  );
}
function Start({ prefs, bank, draft, overrides, go, accent }) {
  const lines = draft.split("\n").filter(l => l.trim()).length;
  const other = prefs.accent === "grape" ? ACCENTS.slime : ACCENTS.grape;
  const motion = prefs.motion === "on";
  const tiles = {
    lookup: <Tile key="l" big color={accent.hi} txt={accent.txt} title="lookup"
      sub="vowel-skeleton search" flip={useV2() ? `${E2.size().toLocaleString()} words · v2` : `${LEXICON.length + bank.length} words loaded`}
      motion={motion} onClick={() => go("lookup")} />,
    check: <Tile key="c" color={other.hi} txt={other.txt} title="check"
      sub="a ~ b verdict" motion={motion} onClick={() => go("check")} />,
    draft: <Tile key="d" color={MT.panel} txt={MT.fg} title="draft"
      sub={lines ? `${lines} bars in session` : "paste bars"}
      flip={lines ? "map the end vowels" : "empty"}
      motion={motion} onClick={() => go("draft")} />,
    bank: <Tile key="b" color={other.lo} txt="#FFFFFF" title="bank"
      sub={`${bank.length} word${bank.length === 1 ? "" : "s"} · ${Object.keys(overrides).length} override${Object.keys(overrides).length === 1 ? "" : "s"}`}
      flip="your mouth outranks spelling" motion={motion}
      onClick={() => go("bank")} />,
  };
  return (
    <div>
      <div style={{ fontSize: 42, fontWeight: 200, fontFamily: FONT,
        lineHeight: 1.05, margin: "6px 0 4px" }}>rhyme<br/>instrument</div>
      <div style={{ color: MT.dim, fontSize: 12, fontFamily: FONT,
        marginBottom: 16, letterSpacing: 2 }}>ghost codex · v1.3 metro</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
        {prefs.tiles.map(t => tiles[t])}
        <Tile key="t" color={MT.dim2} txt={MT.fg} title="tune"
          sub="accent · density · tiles" motion={false}
          onClick={() => go("tune")} />
      </div>
    </div>
  );
}

/* ---------- root: pivot shell ---------- */
const ORDER = ["start", "lookup", "check", "draft", "bank", "tune"];
function RhymeInstrument() {
  const [page, setPage] = useState("start");
  const [bank, setBank] = useState([]);
  const [draft, setDraft] = useState("");
  const [overrides, setOverrides_] = useState({});
  const [prefs, setPrefs_] = useState({ accent: "grape", density: "comfy",
    motion: "on", tiles: ["lookup", "check", "draft", "bank"] });
  const [loaded, setLoaded] = useState(false);
  const [drag, setDrag] = useState(null);
  const [engStatus, setEngStatus] = useState("idle");
  useEffect(() => {
    if (!loaded) return;
    if (prefs.engine === "v2") { setEngine("v2"); E2.load(setEngStatus); }
    else setEngine("v1");
  }, [prefs.engine, loaded]);
  const eng = (prefs.engine || "v1") + ":" + engStatus;
  useEffect(() => { (async () => {
    setBank(await loadKey("ghostcodex:bank", []));
    setDraft(await loadKey("ghostcodex:draft", ""));
    const o = await loadKey("ghostcodex:overrides", {});
    setOverrides_(o); setOverrides(o);
    setPrefs_(await loadKey("ghostcodex:metroprefs",
      { accent: "grape", density: "comfy", motion: "on",
        tiles: ["lookup", "check", "draft", "bank"] }));
    setLoaded(true);
  })(); }, []);
  useEffect(() => { if (loaded) saveKey("ghostcodex:bank", bank); }, [bank, loaded]);
  useEffect(() => { if (loaded) {
    const t = setTimeout(() => saveKey("ghostcodex:draft", draft), 800);
    return () => clearTimeout(t);
  }}, [draft, loaded]);
  const setOverride = (word, v) => {
    const o = { ...overrides };
    if (v) o[word] = v; else delete o[word];
    setOverrides_(o); setOverrides(o);
    if (loaded) saveKey("ghostcodex:overrides", o);
  };
  const setPrefs = (p) => { setPrefs_(p); if (loaded) saveKey("ghostcodex:metroprefs", p); };
  const accent = ACCENTS[prefs.accent] || ACCENTS.grape;
  const dense = prefs.density === "dense";
  const idx = ORDER.indexOf(page);
  const nextPage = () => setPage(ORDER[(idx + 1) % ORDER.length]);
  const prevPage = () => setPage(ORDER[(idx - 1 + ORDER.length) % ORDER.length]);
  const onDown = e => setDrag(e.clientX ?? (e.touches && e.touches[0].clientX));
  const onUp = e => {
    if (drag == null) return;
    const x = e.clientX ?? (e.changedTouches && e.changedTouches[0].clientX);
    if (x != null && Math.abs(x - drag) > 70) (x < drag ? nextPage : prevPage)();
    setDrag(null);
  };
  const next = ORDER[(idx + 1) % ORDER.length];
  return (
    <div onPointerDown={onDown} onPointerUp={onUp}
      style={{ minHeight: "100vh", background: MT.bg, color: MT.fg,
        padding: "22px 16px 60px", maxWidth: 760, margin: "0 auto",
        fontFamily: FONT, overflowX: "hidden" }}>
      {!loaded ? (
        <div style={{ color: MT.dim, fontFamily: FONT }}>loading session</div>
      ) : page === "start" ? (
        <Start prefs={prefs} bank={bank} draft={draft} overrides={overrides}
          go={setPage} accent={accent} />
      ) : (
        <div key={page} style={{ animation: prefs.motion === "on"
          ? "mslide 260ms cubic-bezier(.2,.8,.2,1)" : "none" }}>
          <div style={{ whiteSpace: "nowrap", overflow: "hidden",
            margin: "0 -16px 14px", padding: "0 16px" }}>
            <span onClick={() => setPage("start")} style={{ fontSize: 40,
              fontWeight: 200, cursor: "pointer", lineHeight: 1 }}>{page}</span>
            <span onClick={nextPage} style={{ fontSize: 40, fontWeight: 200,
              color: MT.dim2, marginLeft: 26, cursor: "pointer",
              lineHeight: 1 }}>{next}</span>
          </div>
          {page === "lookup" && <Lookup bank={bank} accent={accent} dense={dense} eng={eng} />}
          {page === "check" && <Check accent={accent} eng={eng} />}
          {page === "draft" && <Draft draft={draft} setDraft={setDraft}
            overrides={overrides} setOverride={setOverride} accent={accent} dense={dense} eng={eng} />}
          {page === "bank" && <Bank bank={bank} setBank={setBank}
            overrides={overrides} setOverride={setOverride} accent={accent} dense={dense} />}
          {page === "tune" && <Tune prefs={prefs} setPrefs={setPrefs} accent={accent} engStatus={engStatus} />}
          <div style={{ color: MT.dim2, fontSize: 11, marginTop: 26,
            fontFamily: FONT }}>swipe for {next} · tap the header for start</div>
        </div>
      )}
      <style>{`@keyframes mslide { from { opacity: 0; transform: translateX(60px); }
        to { opacity: 1; transform: translateX(0); } }`}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<RhymeInstrument />);

</script>
</body>
</html>
