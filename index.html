/* ==== OCCVM SPINE spine.css — spliced from occvm/spine.css. do not edit. ==== */
/* sha256:731eab55777d */
/* OCCVM 1.0 — the spine. Authored in occvm/SPINE.md; this is its machine-readable half.
 *
 * Spliced into a tool by occvm/tools/splice-spine.js. Do not hand-edit the spliced copy in a tool: the
 * next splice reverts it silently, and the loss reads as a mystery bug three sessions later.
 *
 * 1.0 IS A NO-OP BY CONSTRUCTION. Every value here is one both tools were already carrying, measured
 * identical at all three golden instants. The one exception is --serif, spine-governed in a single
 * spelling; the two tools held the same five faces in the same order with different whitespace.
 * Anything else that moves in occvm/golden after a splice is a splice bug, not a design change.
 */

:root {
  /* OCCVM-L1 — substrate and inscription. Only the invariants are here; --sub/--sub-hi/--sub-lo/--bone
     are derived from twilight in Rhyme and static in BTC, so they are registered (SPINE.md 2b) and
     become spine at 1.2 when L9's ramp is unified. */
  --edge: #0b0a10;
  --bone-lo: #b7ad9c;

  /* OCCVM-L5 — the gilt ramp marks what decides, and nothing else. */
  --gilt-c: #7a5510;
  --gilt-b: #d9a52c;
  --gilt-a: #ffe9a3;

  /* binding */
  --bronze-c: #4f3a1c;
  --bronze-b: #8f6a35;
  --bronze-a: #d9a866;

  /* seam, age */
  --verdigris: #3f9a86;
  --verdigris-lo: #23574c;

  /* OCCVM-L7 — the serif carries section heads in both tools. The mono face is OS-supplied in both and
     is registered, not governed, until 1.3 closes D3. */
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;

  /* OCCVM-L4 (1.2) — cast depth. A surface picks a depth; it never authors an offset.
   *
   * THE SIGN IS NEGATIVE AND THAT IS THE POINT. (--lx, --ly) points TOWARD the sun: ly = -cos(azimuth),
   * so at noon the sun is due south and ly = +1, which is screen-down. A lit bevel therefore sits at
   * +(lx, ly) — the face turned toward the light — and a cast falls at -(lx, ly), away from it.
   *
   * Every fixed offset this replaced had it backwards. BTC's tile cast `0 16px 36px` threw the shadow
   * down-screen, which at noon is toward the sun; Rhyme's one derived drop-shadow used +(lx, ly) for the
   * same reason. Both read plausible and both were inverted, which is exactly why "no fixed offset
   * survives" is worth more than tidiness.
   *
   * Magnitudes are anchored so each depth reproduces at high sun the LENGTH of the offset it replaced
   * (2px/5px, 3px/8px, 16px/36px against a noon rake of 5.6px) — the length is preserved, the direction
   * is corrected. Alphas are fractions of --shade-a, so a cast fades with the light like everything else. */
  --occvm-cast-1:
    calc(var(--lx, 0) * var(--rake, 4px) * -.36) calc(var(--ly, 1) * var(--rake, 4px) * -.36)
    calc(var(--rake, 4px) * .9) rgba(0, 0, 0, calc(var(--shade-a, .6) * .67));
  --occvm-cast-2:
    calc(var(--lx, 0) * var(--rake, 4px) * -.54) calc(var(--ly, 1) * var(--rake, 4px) * -.54)
    calc(var(--rake, 4px) * 1.43) rgba(0, 0, 0, calc(var(--shade-a, .6) * .80));
  --occvm-cast-3:
    calc(var(--lx, 0) * var(--rake, 4px) * -2.87) calc(var(--ly, 1) * var(--rake, 4px) * -2.87)
    calc(var(--rake, 4px) * 6.4) rgba(0, 0, 0, calc(var(--shade-a, .6) * .73));

  /* OCCVM-L2 — a bevel is struck from the light, never from a fixed edge. A surface multiplies these by
     its own depth in px: inset calc(var(--lit-x) * 1.2) ... */
  --lit-x: calc(var(--lx, 0) * 1px);
  --lit-y: calc(var(--ly, 1) * 1px);
  --cut-x: calc(var(--lx, 0) * -1px);
  --cut-y: calc(var(--ly, 1) * -1px);

  /* OCCVM-L2 (1.8) — the bevel as a VALUE, so it can sit in a box-shadow list beside a cast.
   *
   * .occvm-slab and .occvm-cast both own `box-shadow`, so a surface could not wear both: whichever rule
   * came later won, and the other was silently lost. Every surface that wanted a cut face AND a cast had
   * to re-author the bevel by hand — which is how channel literals get back into a tool that had removed
   * them, and it is exactly the composition gap the 1.8 reference surface was built to find (it hit it on
   * its own first section). A surface now writes: box-shadow: var(--occvm-bevel), var(--occvm-cast-2). */
  --occvm-bevel:
    inset var(--lit-x) var(--lit-y) 0 rgba(255, 255, 255, var(--hi-a, .12)),
    inset var(--cut-x) var(--cut-y) 0 rgba(0, 0, 0, var(--cut-a, .35));

  /* OCCVM-L10 (1.1) — vein habit. density is the walker budget as a fraction of the lattice; habit is
     the anisotropy of the growth, 0 for the equant dendrite of a manganese oxide and 1 for an elongated
     acicular form. Both are read by the shared generator, so a tool tunes its own surface without
     acquiring a second generator. */
  --vein-density: .3;
  --vein-habit: .55;
}

/* ---- primitives (SPINE.md 3) ----------------------------------------------------------------------
 * Namespaced, because .row, .wrap and .note already mean incompatible things in the two tools (D11).
 * Declared at 1.0 and used by nothing; adoption is per-surface, at the release each law names. Every
 * var() below carries a fallback so a primitive is inert rather than broken in a tool that has not yet
 * been given the token.
 */

/* OCCVM-L4 — cast shadow derives from the light vector. No fixed offset survives outside this rule. */
.occvm-cast { box-shadow: var(--occvm-cast-2); }
.occvm-cast-1 { box-shadow: var(--occvm-cast-1); }
.occvm-cast-3 { box-shadow: var(--occvm-cast-3); }

/* OCCVM-L2 (2.6) — a surface is HELD, not cut: radius from the substance's capillary length.
 *
 * This law read "a surface is cut, not rounded: radius <= 4px" for six releases, and that ceiling was a
 * crystal's arris — a cut mineral holds a sharp edge, so 4px was a real property of the material the
 * system was made of. A yield-stress fluid cannot hold one: surface tension rounds every free edge to
 * the capillary length whether anyone wants it to or not.
 *
 *   --occvm-r = lc = sqrt(gamma / rho*g) = 1.891 mm = 7.15 px at 96 dpi
 *
 * DERIVED, NOT AUTHORED, and asserted against occvm/rheology.js by test/occvm.js so the two cannot drift.
 *
 * WHAT IT DOES NOT YET DO, MEASURED RATHER THAN ASSUMED. `.occvm-slab` is worn by ZERO elements in either
 * tool, so this token currently reaches nothing — the primitive set has been declared and unadopted since
 * 1.0 and this changes that in no way. And the ceiling it replaces is not what the tools paint: BTC's own
 * surfaces run 16–22px with nine 999px pills, Rhyme's run 2–4px. So L2 is obeyed by one tool and ignored
 * by the other, and 7.15px would ROUND Rhyme while SHARPENING BTC. Which of those is a violation to fix
 * and which a divergence to legitimise is a design decision, not a measurement, and it blocks adoption
 * rather than being answered by this derivation. */
:root { --occvm-r: 7.15px; }

.occvm-slab {
  border-radius: var(--occvm-r);
  background: var(--sub, #1b1a22);
  border: 1px solid var(--edge);
  box-shadow: var(--occvm-bevel);
}

/* OCCVM-L1 — a hairline division, ink at its faintest. */
.occvm-rule {
  border: 0;
  border-top: 1px solid rgba(236, 227, 208, .13);
}

/* OCCVM-L8 (1.5) — an action is a real control.
 *
 * This reset lets a <button> carry a surface's own class without the user agent's styling changing how
 * it looks, so semantics can be corrected without redesigning anything. Everything a UA imposes on a
 * button and a div does not have is neutralised; nothing else is set, so the surface's own rule still
 * decides layout, colour and size.
 *
 * No pseudo-element is used to enlarge a hit area. Two reasons, both load-bearing: a tool's own class may
 * already own ::before and ::after (Rhyme's .stone owns both), and an overlay large enough to reach 44px
 * on a dense inline sequence overlaps the neighbour it exists to distinguish, which trades a size floor
 * for a wrong target. Where a surface must grow, it grows for real. */
.occvm-act {
  -webkit-appearance: none;
  appearance: none;
  background: none;
  border: 0;
  margin: 0;
  padding: 0;
  border-radius: 0;
  font: inherit;
  color: inherit;
  letter-spacing: inherit;
  line-height: inherit;
  text-align: inherit;
  text-transform: inherit;
  cursor: pointer;
}

/* OCCVM-L8 — one focus ring across the system. */
.occvm-focus:focus-visible,
.occvm-act:focus-visible {
  outline: 2px solid var(--gilt-b);
  outline-offset: 2px;
}

/* OCCVM-L7 — tabular figures under a column. Adopted at 1.3. */
.occvm-num {
  font-variant-numeric: tabular-nums lining-nums;
}

/* OCCVM-L8 (1.5) — every motion respects the viewer's preference.
 *
 * Declared once, in the spine, and deliberately not per-surface: a rule listing the selectors that
 * animate today is a rule that a new animation escapes tomorrow. Before 1.5 BTC's price readout carried a
 * half-second colour transition and its collapse chevron a transform, both unguarded, while its only
 * media query tested no-preference — the inverse of the one that matters.
 *
 * Durations go to a hundredth of a millisecond rather than zero so that transitionend and animationend
 * still fire; a listener waiting on one would otherwise hang forever. */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
/* ==== END OCCVM spine.css ==== */

:root {
  --lx: 0; --ly: 1; --elev: .6; --fill: .7; --night: 0; --glow: .6; --sheen: .6;
  --rake: 6px; --nglow: 0px; --nglow-s: 0px; --lxpx: 0px; --lypx: 1px;
  --hi-a: .2; --cut-a: .3; --shade-a: .6;
  --sub: #1b1a22; --sub-hi: #2c2a36; --sub-lo: #0e0d13; --edge: #0b0a10;
  --bone: #ece3d0; --bone-lo: #b7ad9c;
  --gilt-a: #ffe9a3; --gilt-b: #d9a52c; --gilt-c: #7a5510;

}

/* ---- the stack ---- */

  background: linear-gradient(180deg, var(--sub-hi) 0%, var(--sub) 30%, var(--sub-lo) 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,var(--hi-a)), inset 0 -1px 0 rgba(0,0,0,.7), inset 3px 0 0 var(--mineral-lo), 0 4px 0 -1px var(--edge), 0 6px 14px rgba(0,0,0,.55);
  transition: transform 260ms cubic-bezier(.2,.8,.2,1); }

  background: repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px); }

.slab { position: relative; padding: var(--pad); margin-bottom: 26px; border-radius: 3px 5px 4px 3px; --thick: 16px; --veins: none;
  background:
    linear-gradient(calc(atan2(var(--ly), var(--lx)) * 1rad + 90deg), rgba(255,255,255,calc(.16 * var(--elev))) 0%, rgba(255,255,255,calc(.05 * var(--elev))) 22%, transparent 46%, rgba(0,0,0,calc(.30 * var(--elev))) 100%),
    var(--veins),
radial-gradient(140% 90% at 20% 0%, var(--sub-hi) 0%, transparent 55%),
    radial-gradient(120% 80% at 90% 100%, color-mix(in srgb, var(--mineral-lo) 35%, var(--sub-lo)) 0%, transparent 55%),

  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='1.4' numOctaves='1' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .8  0 0 0 0 .78  0 0 0 0 .85  0 0 0 .07 0'/></filter><rect width='120' height='120' filter='url(%23g)'/></svg>"); }

  text-shadow: calc(var(--lx) * -.8px) calc(var(--ly) * -.8px) 0 rgba(255,255,255,var(--cut-a)), calc(var(--lx) * .9px) calc(var(--ly) * .9px) 0 rgba(0,0,0,.9), 0 0 var(--nglow) rgba(255,230,170,.45); }

  display: flex; align-items: center; justify-content: center; font-size: 11px; line-height: 1; letter-spacing: .2px;
  color: #fff8ec; text-shadow: 0 1px 1px rgba(0,0,0,.9), 0 0 3px rgba(0,0,0,.5);
  background: color-mix(in srgb, var(--c) 72%, transparent);
  box-shadow: inset 0 0 6px color-mix(in srgb, var(--c) 55%, white), inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 0 rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.65); }
.stone::before { content: ""; position: absolute; inset: -7px -6px; border-radius: 9px; z-index: -1; opacity: var(--glow);
  background: radial-gradient(closest-side, var(--c) 0%, color-mix(in srgb, var(--c) 60%, transparent) 45%, transparent 100%); filter: blur(5px) saturate(1.4) brightness(1.5); }
.stone::after { content: ""; position: absolute; inset: 2px 3px; border-radius: 2px; pointer-events: none; opacity: var(--sheen);
  background: radial-gradient(60% 55% at 40% 35%, rgba(255,255,255,.55), rgba(255,255,255,0) 65%); transform: translate(calc(var(--lx) * -4px), calc(var(--ly) * -4px)); }
.stone.s0 { background: color-mix(in srgb, var(--c) 55%, transparent); }
.stone.s0::before { opacity: calc(var(--glow) * .7); }
.stone.pickable { cursor: pointer; }
.stone.chosen { box-shadow: inset 0 0 6px color-mix(in srgb, var(--c) 55%, white), inset 0 1px 0 rgba(255,255,255,.28), 0 0 0 2px var(--gilt-b); }
.marks { display: flex; gap: 2px; }
.mark { flex: 1; min-width: 25px; height: 3px; border-radius: 1px; background: var(--sub-lo);
  box-shadow: inset calc(var(--lx) * .6px) calc(var(--ly) * .6px) 0 rgba(0,0,0,.9), inset calc(var(--lx) * -.6px) calc(var(--ly) * -.6px) 0 rgba(255,255,255,var(--hi-a)), 0 0 4px color-mix(in srgb, var(--c, #888) 45%, transparent); }
.mark.p1 { height: 5px; background: #08070a; } .mark.p2 { height: 4px; opacity: .85; } .mark.p0 { height: 1px; opacity: .6; }
.picker { margin: 6px 0 4px; padding: 8px 8px 6px; border-radius: 3px; background: rgba(0,0,0,.35); box-shadow: inset 0 1px 2px rgba(0,0,0,.8), inset 0 0 0 1px color-mix(in srgb, var(--mineral) 40%, transparent); }
.picker .who { font-size: 12px; color: var(--bone-lo); margin-bottom: 6px; }
.picker .who i { color: var(--bone); }
.picker .stones { flex-wrap: wrap; gap: 5px; cursor: default; }
.picker .clear { font-size: 12px; color: #f0c36a; margin-left: 6px; align-self: center; cursor: pointer; text-decoration: underline; }
.picker .reads { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,.06); }
.picker .read { padding: 4px 6px; border-radius: 3px; margin: 2px 0; cursor: pointer; }
.picker .read.cur { background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px var(--gilt-c); }
.group .gh.mosaic { color: #f0c36a; }
.inlay.slantish { font-style: italic; }
.crack { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
.crack path { fill: none; stroke-linecap: round; }
.crack .dark { stroke: rgba(0,0,0,.9); stroke-width: 1.2; }
.crack .lit { stroke: rgba(255,255,255,var(--cut-a)); stroke-width: .8; transform: translate(calc(var(--lx) * -.8px), calc(var(--ly) * -.8px)); }
.foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 9px; font-size: 12px; color: var(--bone-lo); }
.foot .warn { color: #f0c36a; }
.foot .bad { color: #e0705a; }
.graph { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
.graph path { fill: none; stroke-linecap: round; filter: drop-shadow(0 0 var(--nglow-s) var(--vein-hi)); }
.graph .body { stroke: var(--vein-lo); opacity: .55; } .graph .thread { stroke: var(--vein-hi); }
.graph .perfect .thread { stroke-width: 1.7; opacity: .95; } .graph .perfect .body { stroke-width: 5; }
.graph .slant .thread { stroke-width: 1.1; opacity: .8; } .graph .slant .body { stroke-width: 3.2; }
.graph .loose .thread { stroke-width: .9; opacity: .65; stroke-dasharray: 3 4; } .graph .loose .body { stroke-width: 2.4; opacity: .35; }
.drone { font-size: 13px; color: #f0c36a; margin: 6px 0 12px; }
.terminal { font-size: 12.5px; color: var(--bone-lo); line-height: 1.5; margin-top: 6px; }

/* ---- lookup / bank: word inlays ---- */
.group { margin-top: 14px; }
.group .gh { font-size: 12.5px; margin-bottom: 7px; }
.group .gh.perfect { color: var(--gilt-a); } .group .gh.slant { color: var(--vein-hi); } .group .gh.loose { color: #cdebb8; } .group .gh.shallow { color: var(--bone-lo); }
.inlays { display: flex; flex-wrap: wrap; gap: 6px; }
.inlay { padding: 6px 10px; border-radius: 2px; font-size: 14px; color: var(--bone); cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; position: relative;
  background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.5)); box-shadow: inset calc(var(--lx) * .8px) calc(var(--ly) * .8px) 1px rgba(0,0,0,.9), inset calc(var(--lx) * -.6px) calc(var(--ly) * -.6px) 0 rgba(255,255,255,var(--hi-a)), inset 3px 0 0 var(--k, var(--bone-lo));
  text-shadow: 0 0 var(--nglow) rgba(255,230,170,.35); }
.inlay.t0 { --k: var(--gilt-b); font-weight: 600; } .inlay.t1 { --k: var(--mineral); } .inlay.t2 { --k: var(--bone-lo); } .inlay.t3 { --k: #3a3742; color: var(--bone-lo); }
.k0 { color: var(--gilt-a); } .k1 { color: var(--vein-hi); } .k3 { color: #6b6674; }
.inlay.banked { --k: var(--verdigris); }
.inlay.banked::after { content: "in bank"; position: absolute; right: 6px; top: -7px; font-size: 9px; color: var(--verdigris); background: var(--sub-lo); padding: 0 4px; border-radius: 2px; }
.inlay .x { margin-left: 8px; color: var(--bone-lo); font-size: 12px; }
.skel { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 12.5px; color: var(--bone-lo); flex-wrap: wrap; }
.verdict { margin-top: 14px; padding: 12px; border-radius: 3px; background: rgba(0,0,0,.35); box-shadow: inset 0 1px 2px rgba(0,0,0,.8), inset 4px 0 0 var(--vk, var(--bone-lo)); }
.verdict .kind { font-size: 15px; color: var(--vk, var(--bone)); margin-bottom: 8px; }
.empty { font-size: 13px; color: var(--bone-lo); margin-top: 12px; line-height: 1.5; }
.bankrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,.5); box-shadow: 0 1px 0 rgba(255,255,255,.04); }
.bankrow .wd { font-size: 16px; }
.bankrow .wd.override { color: var(--gilt-a); }
.bankrow .rm { font-size: 13px; color: var(--bone-lo); padding: 4px 8px; cursor: pointer; }
/* OCCVM-L8 (1.5) — surfaces that became <button> and were block-level as <div>/<p>. A button defaults to
   inline-block, so these restate the flow they had; .stones, .break, .ghost, .head and .word set their own
   display and need nothing. .occvm-act neutralises the rest of the user agent's button styling. */
/* .edge is NOT here on purpose: it sets its own display:flex with space-between, and forcing block on it
   collapsed the face rows into jammed text. A button only needs its flow restated when the element it
   replaced was block by default and the class says nothing about display. */
.text.occvm-act,
.pl.occvm-act { display: block; width: 100%; }
.edge.occvm-act { width: 100%; }

/* OCCVM-L8 — the 44px floor, on chrome. Exempt, per the law: anything inline in a flow of text — the
   stones, the words they sit under, the bar text — because enlarging those restructures the poem and an
   overlay wide enough to reach 44px covers the neighbouring stone it exists to distinguish. */
.cast.occvm-act,
.pl.occvm-act,
.rm.occvm-act,
.inlay.occvm-act { min-height: 44px; }
.clear.occvm-act { min-height: 44px; display: inline-flex; align-items: center; }
.cast.occvm-act { display: flex; align-items: center; justify-content: center; }
/* the wordmark and each section head close an open face; both are chrome, so both take the floor */
.binding h1 .occvm-act,
.head.occvm-act { min-height: 44px; }
.head.occvm-act { align-items: center; width: 100%; }
/* a button is shrink-to-fit, so a flex container that is one collapses its own space-between */

@media (prefers-reduced-motion: reduce) { .slab, .edge { animation: none !important; transition: none !important; } }

/* scheme letter, engraved at the bar's right edge */
.scheme { position: absolute; right: -19px; top: 8px; font-size: 13px; color: var(--bone-lo); z-index: 2;
  text-shadow: calc(var(--lx) * -.6px) calc(var(--ly) * -.6px) 0 rgba(255,255,255,var(--cut-a)), calc(var(--lx) * .7px) calc(var(--ly) * .7px) 0 rgba(0,0,0,.9); }
/* shelf */
.shelf { margin-bottom: 10px; }
.shelf .dim, .shelflist .dim { color: var(--bone-lo); font-size: 12px; }
.shelflist { margin: 8px 0 4px; padding: 4px 10px; border-radius: 3px; background: rgba(0,0,0,.3); box-shadow: inset 0 1px 2px rgba(0,0,0,.8); }
.shelflist .bankrow.cur .wd { color: var(--gilt-a); }
.shelflist .wd { cursor: pointer; }

/* editing on the stone */
.barcut { padding: 6px 8px; font-size: var(--text); line-height: 1.32; }
.break { height: 18px; margin: 0 0 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: .5; }
.break span { font-size: 11px; color: var(--bone-lo); letter-spacing: 2px; text-transform: uppercase; }
.ghost { height: 44px; border-radius: 2px 3px 3px 2px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--bone-lo); cursor: pointer; margin-bottom: 8px;
  background: repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 4px, transparent 4px 10px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
/* share panel */
.share { margin-top: 10px; padding: 10px; border-radius: 3px; background: rgba(0,0,0,.3); box-shadow: inset 0 1px 2px rgba(0,0,0,.8), inset 0 0 0 1px color-mix(in srgb, var(--mineral) 35%, transparent); }
.picklist { max-height: 160px; overflow: auto; margin-top: 8px; border-radius: 3px; background: rgba(0,0,0,.35); }
.picklist .pl { padding: 7px 10px; font-size: 14px; color: var(--bone-lo); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid rgba(255,255,255,.04); }
.picklist .pl.on { color: var(--gilt-a); background: rgba(255,255,255,.04); }
.preview { margin-top: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.6); border-radius: 4px; overflow: hidden; }

/* meter panel: template fit readout */
.fit { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13.5px; }
.fit .nm { flex: 0 0 92px; color: var(--bone); }
.fit .syl { flex: 0 0 42px; font-size: 11.5px; color: var(--bone-lo); }
.fit .track { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.5); }
.fit .fill { display: block; height: 100%; background: var(--vein-hi); border-radius: 4px; }
.fit.top .nm { color: var(--gilt-a); }
.fit.top .fill { background: var(--gilt-a); }
.fit .pct { flex: 0 0 34px; text-align: right; color: var(--bone-lo); font-variant-numeric: tabular-nums; }
.weak { display: flex; gap: 9px; align-items: baseline; padding: 6px 0; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,.04); }
.weak .pct { flex: 0 0 34px; color: var(--bone-lo); font-variant-numeric: tabular-nums; }
.weak .ln { flex: 1; color: var(--bone-lo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.weak .why { flex: 0 0 auto; font-size: 11px; color: var(--bone-lo); opacity: .8; }

</style>

/* ---------- storage v2, with a one-time carry from the metro keys ---------- */
const STORE = {

        return r ? JSON.parse(r) : null;
      };
      const bank = old("bank"),
        draft = old("draft"),
        ov = old("overrides"),
        mp = old("metroprefs");
      if (bank) STORE.set("bank", bank);
      if (draft) STORE.set("shelf", [{
        id: "carried",
        name: "carried draft",
        text: draft,
        updated: Date.now()

      if (draft) STORE.set("current", "carried");
